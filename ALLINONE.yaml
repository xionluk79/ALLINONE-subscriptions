      - hysteria2-GC3T4Csb02
      - anytls-GC3T4Csb02
      - vless-reality-vision-GC3T4Ciij03
      - hysteria2-GC3T4Ciij03
      - anytls-GC3T4Ciij03
      - vless-reality-vision-LCVN1t
      - hysteria2-LCVN1t

  - name: 自动选择
    type: url-test
    url: https://www.gstatic.com/generate_204
    interval: 300
    tolerance: 50
    proxies:
      - vless-reality-vision-linux.de689d.com
      - hysteria2-linux.de689d.com
      - anytls-linux.de689d.com
      - vless-reality-vision-GC10T
      - hysteria2-GC10T
      - anytls-GC10T
      - vless-reality-vision-GC3T4Csb01
      - hysteria2-GC3T4Csb01
      - anytls-GC3T4Csb01
      - vless-reality-vision-GC3T4Csb02
      - hysteria2-GC3T4Csb02
      - anytls-GC3T4Csb02
      - vless-reality-vision-GC3T4Ciij03
      - hysteria2-GC3T4Ciij03
      - anytls-GC3T4Ciij03
      - vless-reality-vision-LCVN1t
      - hysteria2-LCVN1t

  - name: 🌍选择代理节点
    type: select
    proxies:
      - 负载均衡
      - 自动选择
      - DIRECT
      - vless-reality-vision-linux.de689d.com
      - hysteria2-linux.de689d.com
      - anytls-linux.de689d.com
      - vless-reality-vision-GC10T
      - hysteria2-GC10T
      - anytls-GC10T
      - vless-reality-vision-GC3T4Csb01
      - hysteria2-GC3T4Csb01
      - anytls-GC3T4Csb01
      - vless-reality-vision-GC3T4Csb02
      - hysteria2-GC3T4Csb02
      - anytls-GC3T4Csb02
      - vless-reality-vision-GC3T4Ciij03
      - hysteria2-GC3T4Ciij03
      - anytls-GC3T4Ciij03
      - vless-reality-vision-LCVN1t
      - hysteria2-LCVN1t
      - vless-reality-vision-UUISP
      - hysteria2-UUISP
      - anytls-UUISP

  # Claude / Anthropic 专用。仅 UUISP 三条直连，不含 DIRECT、全局组或 LCVN1t。
  # 列表第一项为默认：握手测试中延迟最低且出口校验通过的 anytls-UUISP。
  - name: Claude
    type: select
    proxies:
      - anytls-UUISP
      - hysteria2-UUISP
      - vless-reality-vision-UUISP

